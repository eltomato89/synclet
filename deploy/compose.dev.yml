services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synclet
      POSTGRES_PASSWORD: synclet
      POSTGRES_DB: synclet
    ports: ["5434:5432"]
    volumes: [pgdata-dev:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synclet"]
      interval: 2s
      retries: 30
volumes:
  pgdata-dev:
