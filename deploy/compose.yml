# Synclet. Works standalone: only this file and a filled .env (from .env.example) are needed;
# the images are pulled from GHCR. Start:  docker compose up -d
# Update: set SYNCLET_VERSION in .env (or keep latest), then  docker compose pull && docker compose up -d
# Build the images from a repository checkout instead: add -f compose.build.yml (see there).
name: synclet
services:
  server:
    image: ghcr.io/eltomato89/synclet-server:${SYNCLET_VERSION:-latest}
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      DATABASE_URL: postgresql://synclet:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/synclet
      SYNCLET_PUBLIC_URL: ${SYNCLET_PUBLIC_URL:-}
      SYNCLET_WATCH: ${SYNCLET_WATCH:-on}
      SYNCLET_SCAN_INTERVAL: ${SYNCLET_SCAN_INTERVAL:-}
      SYNCLET_MAX_UPLOAD_BYTES: ${SYNCLET_MAX_UPLOAD_BYTES:-}
      SYNCLET_MASS_DELETE_THRESHOLD: ${SYNCLET_MASS_DELETE_THRESHOLD:-}
      SYNCLET_TOMBSTONE_WINDOW: ${SYNCLET_TOMBSTONE_WINDOW:-}
      SYNCLET_JOURNAL_RETENTION_DAYS: ${SYNCLET_JOURNAL_RETENTION_DAYS:-}
      SYNCLET_SECURE_COOKIES: ${SYNCLET_SECURE_COOKIES:-}
      SYNCLET_TRUST_PROXY: "true" # the server port is not published; only Caddy reaches it
      SYNCLET_ROLE: server
      SYNCLET_TRASH_RETENTION_DAYS: ${SYNCLET_TRASH_RETENTION_DAYS:-}
      SYNCLET_SEARCH_LANGUAGE: ${SYNCLET_SEARCH_LANGUAGE:-}
      SYNCLET_VERSIONS: ${SYNCLET_VERSIONS:-}
      SYNCLET_VERSIONS_MAX_BYTES: ${SYNCLET_VERSIONS_MAX_BYTES:-}
      SYNCLET_SSO_EMERGENCY: ${SYNCLET_SSO_EMERGENCY:-}
      SYNCLET_SSO_ALLOW_HTTP_ISSUER: ${SYNCLET_SSO_ALLOW_HTTP_ISSUER:-}
      SYNCLET_UPDATE_CHECK: ${SYNCLET_UPDATE_CHECK:-}
      SYNCLET_UPDATE_REPO: ${SYNCLET_UPDATE_REPO:-}
    volumes:
      - ${SYNCLET_DATA:?set SYNCLET_DATA to your files folder}:/data
      - ${SYNCLET_META:?set SYNCLET_META to a folder outside SYNCLET_DATA}:/meta
      # Team folders: every direct subfolder is a team space (created/renamed in the admin area).
      - ${SYNCLET_TEAMS:-./teams}:/teams
      # External storages: every folder mounted below /storage becomes a space (name = folder name).
      # Mount the same path read-only into the worker (below). Examples:
      #   a host folder (bind mount):
      # - /mnt/archive:/storage/Archiv
      #   a network share (named CIFS volume, see "volumes:" at the end of this file):
      # - nas-fotos:/storage/Fotos
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
  worker:
    # Same image, derivatives worker role: thumbnails, previews, text extraction. Never runs migrations.
    image: ghcr.io/eltomato89/synclet-server:${SYNCLET_VERSION:-latest}
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      DATABASE_URL: postgresql://synclet:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/synclet
      SYNCLET_ROLE: worker
      SYNCLET_WORKER_CONCURRENCY: ${SYNCLET_WORKER_CONCURRENCY:-}
      SYNCLET_PREVIEW_MAX_BYTES: ${SYNCLET_PREVIEW_MAX_BYTES:-}
      SYNCLET_SEARCH_LANGUAGE: ${SYNCLET_SEARCH_LANGUAGE:-}
    volumes:
      - ${SYNCLET_DATA:?set SYNCLET_DATA to your files folder}:/data:ro
      - ${SYNCLET_META:?set SYNCLET_META to a folder outside SYNCLET_DATA}:/meta
      - ${SYNCLET_TEAMS:-./teams}:/teams:ro
      # External storages, read-only (same paths as in the server):
      # - /mnt/archive:/storage/Archiv:ro
      # - nas-fotos:/storage/Fotos:ro
    depends_on:
      server: { condition: service_healthy }
    healthcheck: { disable: true } # the worker has no HTTP port (the image healthcheck targets the server)
    stop_grace_period: 150s # a running ffmpeg job may take up to 120 s
    restart: unless-stopped
  caddy:
    # Caddy with the built web app and the Caddyfile baked in.
    image: ghcr.io/eltomato89/synclet-web:${SYNCLET_VERSION:-latest}
    environment:
      SYNCLET_SITE_ADDRESS: ${SYNCLET_SITE_ADDRESS:-:80}
      SYNCLET_TRUSTED_PROXIES: ${SYNCLET_TRUSTED_PROXIES:-}
      # Only these direct peers may pass forward-auth headers (Remote-*); empty = stripped always.
      SYNCLET_FORWARD_AUTH_PROXIES: ${SYNCLET_FORWARD_AUTH_PROXIES:-}
      # Declared request body limit for /api/* (same variable and default as the server's upload
      # limit; Caddy would take an empty value literally, so the default is spelled out here).
      SYNCLET_MAX_UPLOAD_BYTES: ${SYNCLET_MAX_UPLOAD_BYTES:-53687091200}
    ports:
      - "${SYNCLET_PORT:-8080}:80"
      - "${SYNCLET_TLS_PORT:-8443}:443"
    volumes: [caddy-data:/data]
    depends_on: [server]
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synclet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: synclet
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synclet"]
      interval: 3s
      retries: 30
    restart: unless-stopped
volumes:
  pgdata:
  caddy-data:
  # External storage on a NAS (SMB/CIFS), mounted by Docker on the host:
  # nas-fotos:
  #   driver: local
  #   driver_opts:
  #     type: cifs
  #     device: //192.168.1.20/share
  #     o: "addr=192.168.1.20,username=…,password=…,uid=${PUID},gid=${PGID},file_mode=0664,dir_mode=0775"
