# Optional: the Euro-Office Document Server on its OWN SUBDOMAIN (e.g. office.example.com) instead
# of the default /documentserver path of the Synclet site (see README "Office"). A separate origin
# isolates the Document Server's pages from Synclet's; it needs a second DNS name (and certificate).
# Use together with compose.yml (both files next to each other; the office Caddy site is baked into
# the synclet-web image):
#   docker compose -f compose.yml -f compose.office.yml up -d
# or, so that every command (pull, logs, down) includes it, set in .env:
#   COMPOSE_FILE=compose.yml:compose.office.yml
# From a repository checkout, building the images: add -f compose.build.yml and --build.
# The office service itself is defined in compose.yml; this file switches it on (no
# COMPOSE_PROFILES needed) and moves it to the subdomain.
services:
  office:
    profiles: !reset [] # always on with this file (needs Docker Compose 2.24 or newer)
  server:
    environment:
      OFFICE_URL: ${SYNCLET_OFFICE_PUBLIC_URL:?set SYNCLET_OFFICE_PUBLIC_URL (browser-facing https URL of the office site)}
      OFFICE_JWT_SECRET: ${OFFICE_JWT_SECRET:?set OFFICE_JWT_SECRET (openssl rand -hex 32)}
  caddy:
    environment:
      SYNCLET_OFFICE_SITE_ADDRESS: ${SYNCLET_OFFICE_SITE_ADDRESS:?set SYNCLET_OFFICE_SITE_ADDRESS}
      # Added to script-src, frame-src and connect-src (https + wss) of the main site's CSP.
      SYNCLET_OFFICE_PUBLIC_URL: ${SYNCLET_OFFICE_PUBLIC_URL:?set SYNCLET_OFFICE_PUBLIC_URL (browser-facing https URL of the office site)}
      # Enables the office site baked into the image (deploy/Caddyfile.office); /documentserver on
      # the Synclet site stays 404.
      SYNCLET_CADDY_OFFICE: "on"
    depends_on: [office]
