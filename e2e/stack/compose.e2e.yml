# Additions to deploy/compose.yml for scripts/e2e-fresh.sh only (never for a real installation).
# Paths are relative to deploy/ (the directory of the first compose file).
services:
  # Images tagged per run, so parallel runs and the dev images (synclet/*:dev) never collide.
  server:
    image: synclet-e2e/server:${E2E_TAG:?}
  worker:
    image: synclet-e2e/server:${E2E_TAG:?}
  caddy:
    image: synclet-e2e/caddy:${E2E_TAG:?}
  # Mock OpenID provider (interactive login form: any subject, optional claims JSON). It listens on
  # the same port inside and outside, and the browser reaches it as oidc.localhost (Chromium maps
  # *.localhost to the loopback address), the server through the network alias of the same name:
  # one issuer URL that both sides can use.
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      SERVER_PORT: ${E2E_OIDC_PORT:?}
      JSON_CONFIG: '{"interactiveLogin":true}'
    ports:
      - "${E2E_OIDC_PORT:?}:${E2E_OIDC_PORT:?}"
    networks:
      default:
        aliases: [oidc.localhost]
  # Stands in for an authenticating reverse proxy (Authelia, Authentik outpost …): it always sets
  # the Remote-* headers itself (overwriting whatever the client sent) and forwards to Caddy. Caddy
  # trusts it via SYNCLET_TRUSTED_PROXIES (its address only), so only this path logs in by header.
  authproxy:
    image: synclet-e2e/caddy:${E2E_TAG:?}
    command: ["caddy", "run", "--config", "/etc/caddy/authproxy.caddy", "--adapter", "caddyfile"]
    volumes:
      - ../e2e/stack/authproxy.caddy:/etc/caddy/authproxy.caddy:ro
    ports:
      - "${E2E_FORWARD_PORT:?}:80"
    depends_on: [caddy]
