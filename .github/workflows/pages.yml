name: Website (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install (site only)
        run: pnpm install --frozen-lockfile --filter @synclet/site
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - uses: actions/configure-pages@v5
      - name: Build
        run: pnpm --filter @synclet/site build
        env:
          SITE_BASE: /synclet/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
